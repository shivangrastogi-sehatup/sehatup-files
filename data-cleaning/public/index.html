<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ananya Correction Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --desk: #132320; --desk2: #0e1b18; --panel: #1b2c29; --line: #2a413d;
    --ink: #23201a; --paper: #f3eee4; --paper-a: #eaf1ec; --paper-line: #ddd4c3;
    --cream: #eaf2ee; --muted: #8ca39c; --muted2: #6f8a83;
    --verd: #3fb8a0; --verd-deep: #2e8c79; --saffron: #e8a33d; --saffron-deep: #b97b1f;
    --brick: #c25b4e;
    --sans: 'IBM Plex Sans', 'IBM Plex Sans Devanagari', system-ui, sans-serif;
    --disp: 'Space Grotesk', var(--sans);
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --shadow-card: 0 1px 0 rgba(0,0,0,.04), 0 8px 22px -14px rgba(0,0,0,.55);
    --shadow-lift: 0 2px 0 rgba(0,0,0,.05), 0 16px 34px -16px rgba(0,0,0,.6);
  }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); color: var(--cream);
    background:
      radial-gradient(1200px 600px at 78% -10%, #1a2f2b 0%, transparent 60%),
      linear-gradient(180deg, var(--desk) 0%, var(--desk2) 100%);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- desk header ---------- */
  .desk-head {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: 20px 26px; padding: 14px 22px;
    background: linear-gradient(180deg, rgba(27,44,41,.9), rgba(19,35,32,.6));
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand .mark {
    width: 40px; height: 40px; flex: none; display: grid; place-items: center;
    border-radius: 11px; background: var(--paper); color: var(--ink);
    font-size: 20px; box-shadow: var(--shadow-card); transform: rotate(-4deg);
  }
  .brand h1 { font-family: var(--disp); font-weight: 700; font-size: 18px; letter-spacing: -.01em; line-height: 1; }
  .brand h1 em { font-style: normal; color: var(--saffron); }
  .brand .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; letter-spacing: .02em; }

  .chunknav { display: flex; align-items: center; gap: 8px; justify-self: center; }
  .chunknav button {
    font-family: var(--mono); font-size: 12px; color: var(--cream);
    background: rgba(255,255,255,.04); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; cursor: pointer; transition: .15s;
  }
  .chunknav button:hover:not(:disabled) { background: rgba(63,184,160,.14); border-color: var(--verd-deep); }
  .chunknav button:disabled { opacity: .3; cursor: default; }
  .chunknav select {
    font-family: var(--mono); font-size: 12px; color: var(--cream);
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 10px; cursor: pointer; max-width: 320px;
  }

  .ledger { display: flex; gap: 8px; align-items: center; }
  .tile {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,.03);
    border: 1px solid var(--line); min-width: 62px;
  }
  .tile b { font-family: var(--disp); font-size: 17px; line-height: 1; color: var(--cream); font-weight: 700; }
  .tile span { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted2); }
  .tile.rev b { color: var(--verd); }
  .tile.edit b { color: var(--saffron); }
  .tile.excl b { color: var(--brick); }
  #sync { font-family: var(--mono); font-size: 11.5px; color: var(--verd); min-width: 78px; }
  #sync.warn { color: var(--saffron); }
  #sync.err { color: var(--brick); }

  /* ---------- identity strip ---------- */
  .idstrip {
    display: flex; align-items: center; gap: 12px; padding: 8px 22px;
    background: rgba(14,27,24,.6); border-bottom: 1px solid var(--line); font-size: 12.5px;
  }
  .idstrip .lbl { color: var(--muted); }
  .chips { display: inline-flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 4px;
    border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    cursor: pointer; transition: .15s; font-size: 12px; color: var(--muted);
  }
  .chip .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .chip.free { padding-right: 4px; }
  .chip.free:hover { border-color: var(--muted2); color: var(--cream); transform: translateY(-1px); }
  .chip.me { border-color: var(--cream); color: var(--cream); font-weight: 600; box-shadow: 0 0 0 2px rgba(234,242,238,.14); }
  .chip.locked { cursor: not-allowed; opacity: .7; }
  .chip .nm { white-space: nowrap; }
  .chip .lock { font-size: 10px; opacity: .7; }
  #whoami { font-weight: 600; color: var(--cream); }
  #whoami .none { color: var(--muted2); font-weight: 400; }

  /* ---------- main ---------- */
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }

  .rail { background: rgba(14,27,24,.55); border-right: 1px solid var(--line); overflow-y: auto; }
  .rail-head { padding: 12px 16px 8px; font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--muted2); position: sticky; top: 0; background: var(--desk2); z-index: 1; border-bottom: 1px solid var(--line); }
  .exitem { padding: 11px 16px; border-bottom: 1px solid rgba(42,65,61,.5); cursor: pointer; transition: .12s; border-left: 3px solid transparent; }
  .exitem:hover { background: rgba(63,184,160,.06); }
  .exitem.active { background: rgba(63,184,160,.1); border-left-color: var(--verd); }
  .exitem.excluded { opacity: .55; }
  .exitem.excluded .ex-label { text-decoration: line-through; }
  .ex-top { display: flex; align-items: center; gap: 8px; }
  .ex-label { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-flags { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; flex: none; }
  .revdot { width: 9px; height: 9px; border-radius: 50%; }
  .flag { font-size: 9px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 6px; text-transform: uppercase; }
  .flag.edit { background: rgba(232,163,61,.18); color: var(--saffron); }
  .flag.syn { background: rgba(138,90,200,.2); color: #cbb0f2; }
  .ex-prev { font-size: 12px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted2); margin-top: 3px; }

  /* ---------- stage ---------- */
  .stage { display: flex; flex-direction: column; min-height: 0; }
  .stage-head {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 30px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(27,44,41,.5), transparent);
  }
  .phone-field { display: flex; align-items: center; gap: 8px; }
  .phone-field .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted2); }
  .phone-val { font-family: var(--mono); font-size: 15px; color: var(--cream); background: none; border: none; border-bottom: 1.5px dashed transparent; padding: 2px 2px; }
  .phone-field:hover .phone-val { border-bottom-color: var(--line); }
  .phone-val:focus { outline: none; border-bottom-color: var(--saffron); color: #fff; }
  .stage-meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted2); }
  .badge-syn { font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 3px 9px; border-radius: 7px; background: rgba(138,90,200,.2); color: #cbb0f2; }
  .stage-actions { margin-left: auto; display: flex; gap: 9px; }
  .btn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 500; cursor: pointer;
    border-radius: 10px; padding: 8px 15px; border: 1px solid var(--line);
    background: rgba(255,255,255,.03); color: var(--cream); transition: .15s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn:hover { border-color: var(--muted2); }
  .btn.review.on { background: var(--verd-deep); border-color: var(--verd); color: #eafff8; }
  .btn.review.on:hover { background: var(--verd); }
  .btn.exclude.on { background: #6a2a24; border-color: var(--brick); color: #ffdad4; }
  .btn.exclude:hover { border-color: var(--brick); color: #ffb9b0; }

  .convo-wrap { flex: 1; overflow-y: auto; padding: 12px 30px 60px; }
  .convo { max-width: 900px; margin: 0 auto; }
  #reviewers-line { max-width: 900px; margin: 4px auto 10px; font-size: 12px; color: var(--muted); }
  #reviewers-line b { font-weight: 600; }
  .revert-line { max-width: 900px; margin: 0 auto 14px; }
  .revert-line button { font-family: var(--mono); font-size: 11px; color: var(--saffron); background: none; border: 1px dashed var(--saffron-deep); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .revert-line button:hover { background: rgba(232,163,61,.1); }
  .excl-banner { max-width: 900px; margin: 0 auto 14px; padding: 9px 14px; border-radius: 10px; background: rgba(194,91,78,.14); border: 1px solid var(--brick); color: #f0c3bc; font-size: 12.5px; text-align: center; }
  .syn-banner { max-width: 900px; margin: 0 auto 14px; padding: 9px 14px; border-radius: 10px; background: rgba(138,90,200,.14); border: 1px solid #6f4aa0; color: #d8c4f2; font-size: 12.5px; text-align: center; }

  /* seams */
  .seam { position: relative; height: 20px; display: flex; align-items: center; justify-content: center; }
  .seam::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); opacity: 0; transition: .15s; }
  .seam:hover::before { opacity: 1; }
  .seam-btn { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--desk); color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; opacity: 0; transition: .15s; display: grid; place-items: center; }
  .seam:hover .seam-btn { opacity: 1; }
  .seam-btn:hover { background: var(--saffron); color: var(--ink); border-color: var(--saffron); transform: scale(1.12); }

  /* message cards */
  .card { position: relative; max-width: 80%; margin: 3px 0; z-index: 1; }
  .card:hover, .card:focus-within { z-index: 30; }
  .card.user { margin-right: auto; }
  .card.model { margin-left: auto; }
  .card .paper {
    position: relative; background: var(--paper); color: var(--ink);
    border: 1px solid var(--paper-line); border-radius: 14px; padding: 11px 15px 12px;
    box-shadow: var(--shadow-card); transition: box-shadow .15s, transform .15s;
  }
  .card.model .paper { background: var(--paper-a); }
  .card .paper::before { content: ""; position: absolute; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; }
  .card.user .paper::before { left: 0; background: var(--verd-deep); }
  .card.model .paper::before { right: 0; background: #6b8f86; }
  .card:hover .paper { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
  .card.edited .paper { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron), var(--shadow-lift); }

  .role-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .role-name { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--verd-deep); }
  .card.model .role-name { color: #5a7d74; }
  .edited-tab { font-family: var(--mono); font-size: 9.5px; font-weight: 500; color: var(--ink); background: var(--saffron); padding: 1px 7px; border-radius: 5px; }
  .msg-text { font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg-text :where(*) { max-width: 100%; }

  .card .paper { z-index: 1; }
  .card-tools { position: absolute; top: -13px; right: 12px; display: flex; gap: 4px; opacity: 0; transition: .12s; z-index: 40; }
  .card.model .card-tools { right: auto; left: 12px; }
  .card:hover .card-tools, .card:focus-within .card-tools { opacity: 1; }
  .tool { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--paper-line); background: var(--paper); color: #6b6353; font-size: 13px; cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-card); transition: .12s; }
  .tool:hover { color: var(--ink); }
  .tool.del:hover { background: var(--brick); border-color: var(--brick); color: #fff; }
  .tool.flip:hover { background: var(--verd); border-color: var(--verd); color: #05231d; }
  .tool.edit:hover { background: var(--saffron); border-color: var(--saffron); color: var(--ink); }

  /* inline editor */
  .editor { background: var(--paper); border: 1px solid var(--saffron); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow-lift); }
  .card.model .editor { background: var(--paper-a); }
  .editor .role-toggle { display: inline-flex; gap: 4px; margin-bottom: 8px; }
  .role-opt { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--paper-line); background: #fff8; color: #6b6353; cursor: pointer; }
  .role-opt.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .editor textarea {
    width: 100%; font-family: var(--sans); font-size: 14.5px; line-height: 1.5; color: var(--ink);
    background: rgba(255,255,255,.6); border: 1px solid var(--paper-line); border-radius: 9px;
    padding: 9px 11px; resize: none; min-height: 44px;
  }
  .editor textarea:focus { outline: none; border-color: var(--saffron-deep); background: #fff; }
  .editor-actions { display: flex; gap: 7px; margin-top: 9px; }
  .mini { font-family: var(--sans); font-size: 12px; font-weight: 500; padding: 6px 13px; border-radius: 8px; cursor: pointer; border: 1px solid var(--paper-line); background: #fff9; color: var(--ink); }
  .mini.save { background: var(--verd-deep); border-color: var(--verd-deep); color: #eafff8; }
  .mini.save:hover { background: var(--verd); }
  .mini.ghost:hover { background: #0001; }

  .compose-seam { max-width: 80%; margin: 6px auto; }
  .empty-stage, #placeholder { text-align: center; color: var(--muted); margin-top: 12vh; }
  #placeholder .big { font-family: var(--disp); font-size: 22px; color: var(--muted); margin-bottom: 8px; }
  .sysbar { border-top: 1px solid var(--line); background: rgba(14,27,24,.7); padding: 8px 30px; font-size: 12px; }
  .sysbar summary { cursor: pointer; color: var(--cream); font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em; }
  .sysbar p { margin-top: 7px; color: var(--muted); line-height: 1.55; max-width: 900px; }

  @media (max-width: 820px) {
    .desk-head { grid-template-columns: 1fr; gap: 12px; }
    .chunknav, .ledger, .brand { justify-self: start; }
    .ledger { flex-wrap: wrap; }
    main { grid-template-columns: 1fr; }
    .rail { display: none; }
    .rail.show { display: block; position: fixed; inset: 0 40% 0 0; z-index: 20; }
    .card { max-width: 92%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="desk-head">
  <div class="brand">
    <span class="mark">✎</span>
    <div>
      <h1>Ananya <em>Correction Desk</em></h1>
      <div class="sub">read · repair · sign off — training conversations</div>
    </div>
  </div>
  <nav class="chunknav">
    <button id="newer" title="Newer chunk">‹</button>
    <select id="chunksel" aria-label="Choose chunk"></select>
    <button id="older" title="Older chunk">›</button>
  </nav>
  <div class="ledger">
    <div class="tile"><b id="st-total">0</b><span>Examples</span></div>
    <div class="tile rev"><b id="st-rev">0</b><span>Reviewed</span></div>
    <div class="tile edit"><b id="st-edit">0</b><span>Edited</span></div>
    <div class="tile excl"><b id="st-excl">0</b><span>Excluded</span></div>
    <span id="sync"></span>
  </div>
</header>

<div class="idstrip">
  <span class="lbl">Reviewer — pick your colour:</span>
  <span class="chips" id="chips"></span>
  <span id="whoami"></span>
</div>

<main>
  <aside class="rail" id="rail">
    <div class="rail-head">Conversations in this chunk</div>
    <div id="exlist"></div>
  </aside>
  <section class="stage">
    <div id="stage-inner" style="display:flex;flex-direction:column;min-height:0;flex:1;">
      <div class="convo-wrap"><div id="placeholder"><div class="big">Pick a conversation</div>Choose one from the left to review or repair it.</div></div>
    </div>
    <details class="sysbar"><summary>System instruction — sent with every example</summary><p id="sysinstr"></p></details>
  </section>
</main>

<script>
let LIST = [], D = null;
let excluded = new Set();
let reviewsMap = {};   // idx -> [{name,color}]
let editsMap = {};     // idx -> {turns:[{role,text}], phone, editedBy}
let activeIdx = null;
let working = null;    // { turns:[...], phone } — live copy for the active example
let editState = null;  // { mode:'edit'|'compose', pos:int, role:'user'|'model' }
let chunkNo = parseInt(new URLSearchParams(location.search).get('chunk') || '1', 10);

const COLORS = ['#3fb8a0','#e8a33d','#c25b4e','#6f8fd8','#b06ee0'];
let ME = null;
try { ME = JSON.parse(localStorage.getItem('reviewer-identity')); } catch(e) {}
let claimed = {};   // { '#hex': 'Name' } — who holds each colour (shared)

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setSync(txt, cls){ const el=document.getElementById('sync'); el.textContent=txt||''; el.className=cls||''; }

/* ---------- identity & colour locking ---------- */
async function loadReviewers(){
  try { claimed = (await fetch('/api/reviewers').then(r=>r.json())).colors || {}; }
  catch(e){ claimed = {}; }
  if (ME && claimed[ME.color] && claimed[ME.color] !== ME.name){
    ME = null; localStorage.removeItem('reviewer-identity');   // someone else holds it now
  }
  renderIdentity();
}
async function claimColor(color, name){
  const r = await fetch('/api/reviewers',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, color })});
  const j = await r.json().catch(()=>({}));
  if (r.status===409){ alert(`That colour is already taken by ${j.takenBy}. Please pick another.`); return false; }
  if (!r.ok){ alert('Could not claim that colour — try again.'); return false; }
  claimed = j.colors || claimed;
  return true;
}
async function pickColor(color){
  if (claimed[color] && (!ME || claimed[color]!==ME.name)){ alert(`Taken by ${claimed[color]}.`); return; }
  let name = ME && ME.name;
  if (!name){ name = prompt('Your name? (locks your colour and signs your reviews)'); if(!name) return; }
  name = name.trim(); if(!name) return;
  if (!(await claimColor(color, name))) return;
  ME = { name, color };
  localStorage.setItem('reviewer-identity', JSON.stringify(ME));
  renderIdentity(); render();
}
function renderIdentity(){
  const el = document.getElementById('chips'); el.innerHTML='';
  COLORS.forEach(c=>{
    const holder = claimed[c];
    const mine = ME && ME.color===c;
    const lockedByOther = holder && (!ME || holder!==ME.name);
    const b=document.createElement('button');
    b.className='chip '+(mine?'me':(lockedByOther?'locked':'free'));
    b.innerHTML = `<span class="dot" style="background:${c}"></span>` +
      (mine ? `<span class="nm">${esc(ME.name)} · you</span>`
            : holder ? `<span class="nm">${esc(holder)}</span><span class="lock">🔒</span>` : '');
    b.title = lockedByOther ? `Taken by ${holder}` : (mine?'Your colour':'Claim this colour');
    if (!lockedByOther) b.onclick=()=>pickColor(c);
    el.appendChild(b);
  });
  document.getElementById('whoami').innerHTML = ME
    ? `Signed in as <b>${esc(ME.name)}</b>`
    : `<span class="none">pick a free colour to start</span>`;
}
function ensureMe(){
  if (ME) return true;
  alert('Pick a free colour above to set your name first.');
  return false;
}

/* ---------- data loading ---------- */
async function loadList(){
  LIST = await fetch('/training-data/index.json').then(r=>r.json());
  const sel=document.getElementById('chunksel');
  sel.innerHTML = LIST.map(m=>`<option value="${m.chunk}">Chunk ${m.chunk} · ${m.from} → ${m.to} (${m.count})</option>`).join('');
  sel.onchange = ()=>loadChunk(parseInt(sel.value,10));
}
async function parseChunk(meta){
  const [text, metaArr] = await Promise.all([
    fetch('/training-data/'+meta.file).then(r=>r.text()),
    fetch('/training-data/'+meta.file.replace(/\.jsonl$/,'.meta.json')).then(r=>r.ok?r.json():[]).catch(()=>[]),
  ]);
  const lines = text.split('\n').filter(l=>l.trim());
  let system='';
  const examples = lines.map((line,i)=>{
    const ex = JSON.parse(line);
    if (i===0 && ex.systemInstruction) system = ex.systemInstruction.parts[0].text;
    const m = metaArr[i] || {};
    return { idx:i, phone:m.phone||'', date:m.date||'', synthetic:m.synthetic||false,
      turns: ex.contents.map(c=>({ role:c.role, text:c.parts[0].text })) };
  });
  return { ...meta, system, examples };
}
async function loadChunk(n){
  setSync('loading…');
  const meta = LIST.find(m=>m.chunk===n) || LIST[0];
  const [parsed, state] = await Promise.all([
    parseChunk(meta),
    fetch('/api/reviews?file='+encodeURIComponent(meta.file)).then(r=>r.json()).catch(()=>({reviews:{},excluded:[],edits:{}})),
  ]);
  D = parsed; chunkNo = D.chunk;
  excluded = new Set(state.excluded||[]);
  reviewsMap = state.reviews||{};
  editsMap = state.edits||{};
  activeIdx = null; working = null; editState = null;
  document.getElementById('chunksel').value = chunkNo;
  document.getElementById('sysinstr').textContent = D.system;
  history.replaceState(null,'','?chunk='+chunkNo);
  setSync('');
  renderRail(); renderStage(); renderStats();
}

/* effective (edited-or-base) accessors */
function effTurns(ex){ return editsMap[ex.idx] ? editsMap[ex.idx].turns : ex.turns; }
function effPhone(ex){ return editsMap[ex.idx] && editsMap[ex.idx].phone !== undefined ? editsMap[ex.idx].phone : ex.phone; }
function isEdited(idx){ return !!editsMap[idx]; }
function myReview(idx){ return !!(ME && reviewsMap[idx] && reviewsMap[idx][ME.name]); }

/* ---------- persistence (optimistic: UI updates instantly, saves in background) ---------- */
async function saveEdit(){
  if (!ensureMe()) return;
  const idx = activeIdx;
  editsMap[idx] = { turns: working.turns.map(t=>({...t})), phone: working.phone, editedBy: ME.name };
  renderRail(); renderStage(); renderStats(); setSync('saving…','warn');
  try{
    const r = await fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ file:D.file, idx, turns:working.turns, phone:working.phone, editedBy:ME.name })});
    const j = await r.json(); if(!r.ok) throw new Error(j.error||'save failed');
    editsMap[idx] = { turns:j.turns, phone:j.phone, editedBy:ME.name };
    if (activeIdx===idx) working = { turns:j.turns.map(t=>({...t})), phone:j.phone };
    setSync('✓ saved'); if(activeIdx===idx){ renderStage(); renderStats(); }
  }catch(e){ setSync('⚠ save failed','err'); }
}
async function revertEdit(){
  const idx = activeIdx;
  delete editsMap[idx];
  const ex = D.examples.find(e=>e.idx===idx);
  if (activeIdx===idx) working = { turns: ex.turns.map(t=>({...t})), phone: ex.phone };
  renderRail(); renderStage(); renderStats(); setSync('reverting…','warn');
  try{
    const r = await fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ file:D.file, idx, revert:true })});
    if(!r.ok) throw new Error('revert failed'); setSync('✓ reverted');
  }catch(e){ setSync('⚠ revert failed','err'); }
}
async function toggleReview(){
  if (!ensureMe()) return;
  const idx = activeIdx, name = ME.name, had = myReview(idx);
  const cur = { ...(reviewsMap[idx]||{}) };
  if (had) delete cur[name]; else cur[name] = ME.color;
  reviewsMap[idx] = cur;
  renderRail(); renderStage(); renderStats(); setSync('saving…','warn');
  try{
    const r = await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ file:D.file, idx, name, color:ME.color, reviewed:!had })});
    if(!r.ok) throw new Error(); setSync('✓ saved');
  }catch(e){
    const c = { ...(reviewsMap[idx]||{}) }; if(had) c[name]=ME.color; else delete c[name]; reviewsMap[idx]=c;
    setSync('⚠ save failed','err'); renderRail(); renderStage(); renderStats();
  }
}
async function toggleExclude(){
  const idx = activeIdx, now = !excluded.has(idx);
  if (now) excluded.add(idx); else excluded.delete(idx);
  renderRail(); renderStage(); renderStats(); setSync('saving…','warn');
  try{
    const r = await fetch('/api/exclude',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ file:D.file, idx, excluded:now })});
    if(!r.ok) throw new Error(); setSync('✓ saved');
  }catch(e){
    if (now) excluded.delete(idx); else excluded.add(idx);
    setSync('⚠ save failed','err'); renderRail(); renderStage(); renderStats();
  }
}

/* ---------- editing ops (mutate `working`, then save) ---------- */
function selectExample(idx){
  activeIdx = idx; editState = null;
  const ex = D.examples.find(e=>e.idx===idx);
  const src = editsMap[idx] || ex;
  working = { turns: src.turns.map(t=>({...t})), phone: (src.phone!==undefined?src.phone:ex.phone) || '' };
  renderRail(); renderStage();
}
function beginEdit(pos){ editState={mode:'edit',pos,role:working.turns[pos].role}; renderStage(); }
function beginCompose(pos){ if(!ensureMe())return; editState={mode:'compose',pos,role:'user'}; renderStage(); }
function cancelEdit(){ editState=null; renderStage(); }
function commitEdit(){
  const ta=document.getElementById('editor-ta'); if(!ta) return;
  const text=ta.value.trim(); if(!text){ cancelEdit(); return; }
  if(editState.mode==='edit'){ working.turns[editState.pos]={role:editState.role,text}; }
  else { working.turns.splice(editState.pos,0,{role:editState.role,text}); }
  editState=null; saveEdit();
}
function deleteTurn(pos){ working.turns.splice(pos,1); saveEdit(); }
function flipRole(pos){ const t=working.turns[pos]; t.role = t.role==='user'?'model':'user'; saveEdit(); }
function savePhone(v){ if(v===working.phone) return; working.phone=v; saveEdit(); }

/* ---------- rail ---------- */
function renderRail(){
  const el=document.getElementById('exlist'); el.innerHTML='';
  D.examples.forEach(ex=>{
    const turns = effTurns(ex), phone = effPhone(ex);
    const div=document.createElement('div');
    div.className='exitem'+(activeIdx===ex.idx?' active':'')+(excluded.has(ex.idx)?' excluded':'');
    const dots=Object.entries(reviewsMap[ex.idx]||{}).map(([name,color])=>`<span class="revdot" style="background:${color}" title="Reviewed by ${esc(name)}"></span>`).join('');
    const label = ex.synthetic ? `<span class="flag syn">synthetic</span>` : (phone||('#'+(ex.idx+1)));
    const editFlag = isEdited(ex.idx) ? `<span class="flag edit">edited</span>` : '';
    const first = turns[0] ? turns[0].text.slice(0,58) : '(empty)';
    div.innerHTML =
      `<div class="ex-top"><span class="ex-label">${label}</span><span class="ex-flags">${editFlag}${dots}</span></div>
       <div class="ex-prev">${esc(first)}</div>
       <div class="ex-meta">${ex.date||''} · ${turns.length} turns · ${turns.filter(t=>t.role==='user').length}u/${turns.filter(t=>t.role==='model').length}a</div>`;
    div.onclick=()=>selectExample(ex.idx);
    el.appendChild(div);
  });
}

/* ---------- stage ---------- */
function seam(pos){
  return `<div class="seam"><button class="seam-btn" title="Insert a message here" onclick="beginCompose(${pos})">+</button></div>`;
}
function editorHTML(){
  const isCompose = editState.mode==='compose';
  return `<div class="editor">
    <div class="role-toggle">
      <span class="role-opt ${editState.role==='user'?'sel':''}" onclick="editState.role='user';renderStage()">Customer</span>
      <span class="role-opt ${editState.role==='model'?'sel':''}" onclick="editState.role='model';renderStage()">Ananya</span>
    </div>
    <textarea id="editor-ta" placeholder="${isCompose?'Type the new message…':'Edit this message…'}">${isCompose?'':esc(working.turns[editState.pos].text)}</textarea>
    <div class="editor-actions">
      <button class="mini save" onclick="commitEdit()">${isCompose?'Add message':'Save'}</button>
      <button class="mini ghost" onclick="cancelEdit()">Cancel</button>
    </div>
  </div>`;
}
function cardHTML(t, pos){
  const roleName = t.role==='user' ? 'Customer' : 'Ananya';
  const editedTab = isEdited(activeIdx) ? '' : ''; // per-card edited state is implicit; card-level marker below
  return `<div class="card ${t.role}${isEdited(activeIdx)?' edited':''}">
    <div class="card-tools">
      <button class="tool edit" title="Edit" onclick="beginEdit(${pos})">✎</button>
      <button class="tool flip" title="Switch speaker" onclick="flipRole(${pos})">⇄</button>
      <button class="tool del" title="Delete" onclick="deleteTurn(${pos})">×</button>
    </div>
    <div class="paper">
      <div class="role-row"><span class="role-name">${roleName}</span></div>
      <div class="msg-text">${esc(t.text)}</div>
    </div>
  </div>`;
}
function renderStage(){
  const inner=document.getElementById('stage-inner');
  if (activeIdx===null){
    inner.querySelector('.convo-wrap').innerHTML =
      `<div id="placeholder"><div class="big">Pick a conversation</div>Choose one from the left to review or repair it.</div>`;
    return;
  }
  const ex=D.examples.find(e=>e.idx===activeIdx);
  const reviewed = myReview(activeIdx);
  const revEntries = Object.entries(reviewsMap[activeIdx]||{});
  const edited = isEdited(activeIdx);

  let cards='';
  for (let i=0; i<=working.turns.length; i++){
    // seam (or the inline composer) before card i, and after the last card
    if (editState && editState.mode==='compose' && editState.pos===i){
      cards += `<div class="compose-seam"><div class="card ${editState.role}">${editorHTML()}</div></div>`;
    } else {
      cards += seam(i);
    }
    if (i < working.turns.length){
      if (editState && editState.mode==='edit' && editState.pos===i){
        cards += `<div class="card ${editState.role}">${editorHTML()}</div>`;
      } else {
        cards += cardHTML(working.turns[i], i);
      }
    }
  }

  const head = `<div class="stage-head">
      <div class="phone-field">
        <span class="k">Phone</span>
        <input class="phone-val" value="${esc(working.phone)}" placeholder="—"
               onchange="savePhone(this.value.trim())"
               onkeydown="if(event.key==='Enter')this.blur()">
      </div>
      <span class="stage-meta">${ex.date||''} · ${working.turns.length} turns</span>
      ${ex.synthetic?'<span class="badge-syn">🤖 synthetic</span>':''}
      <div class="stage-actions">
        <button class="btn review ${reviewed?'on':''}" onclick="toggleReview()">${reviewed?'✓ Reviewed':'Mark reviewed'}</button>
        <button class="btn exclude ${excluded.has(activeIdx)?'on':''}" onclick="toggleExclude()">${excluded.has(activeIdx)?'Excluded':'Exclude'}</button>
      </div>
    </div>`;

  const banners =
    (ex.synthetic?'<div class="syn-banner">🤖 Claude-generated synthetic example — not a real customer chat.</div>':'') +
    (excluded.has(activeIdx)?'<div class="excl-banner">🚫 This example will NOT go into the final training data.</div>':'') +
    `<div id="reviewers-line">${revEntries.length?'Signed off by: '+revEntries.map(([name,color])=>`<b style="color:${color}">${esc(name)}</b>`).join(', '):'Not reviewed yet.'}${edited?` · <span style="color:var(--saffron)">edited by ${esc(editsMap[activeIdx].editedBy||'—')}</span>`:''}</div>` +
    (edited?`<div class="revert-line"><button onclick="revertEdit()">↩ revert to original conversation</button></div>`:'');

  inner.querySelector('.convo-wrap').innerHTML = head + `<div class="convo">${banners}${cards}</div>`;

  // autofocus editor + autosize
  const ta=document.getElementById('editor-ta');
  if (ta){ ta.focus(); ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,320)+'px';
    ta.oninput=()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,320)+'px'; };
    ta.onkeydown=(e)=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); commitEdit(); } if(e.key==='Escape') cancelEdit(); };
  }
}
function renderStats(){
  document.getElementById('st-total').textContent = D.examples.length;
  document.getElementById('st-excl').textContent = excluded.size;
  document.getElementById('st-edit').textContent = Object.keys(editsMap).length;
  document.getElementById('st-rev').textContent = Object.values(reviewsMap).filter(o=>o&&Object.keys(o).length).length;
  const nums = LIST.map(m=>m.chunk);
  document.getElementById('newer').disabled = chunkNo<=Math.min(...nums);
  document.getElementById('older').disabled = chunkNo>=Math.max(...nums);
}
function render(){ if(D){ renderRail(); renderStage(); renderStats(); } }

document.getElementById('newer').onclick=()=>loadChunk(chunkNo-1);
document.getElementById('older').onclick=()=>loadChunk(chunkNo+1);
renderIdentity();
loadReviewers();
setInterval(loadReviewers, 20000);   // keep the shared colour list fresh
loadList().then(()=>{ const nums=LIST.map(m=>m.chunk); if(!nums.includes(chunkNo)) chunkNo=Math.min(...nums); loadChunk(chunkNo); });
</script>
</body>
